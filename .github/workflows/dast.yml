# DAST passivo com OWASP ZAP baseline (spider + regras passivas, sem ataque) contra o build de
# PRODUÇÃO do app subido no próprio runner. Confere cabeçalhos de segurança (CSP, nosniff,
# anti-clickjacking, Permissions-Policy), cookies, vazamento de versão/erro e CORS.
#
# Ainda não é check obrigatório: o .zap/rules.tsv está em calibração (ver comentários nele).
# Contra preview/staging (com header de bypass da Vercel) entra quando houver alvo de deploy.
name: DAST

on:
  pull_request:
    paths:
      - "apps/web/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - ".zap/**"
      - ".github/workflows/dast.yml"
      - ".github/actions/setup/**"
  schedule:
    - cron: "7 8 * * 2,5" # terça e sexta 08:07 UTC
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  zap-baseline:
    name: ZAP baseline (app local)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      TURBO_TELEMETRY_DISABLED: "1"
      # Build de produção (NODE_ENV=production) como num preview: sem indexação, origem local.
      # As duas são lidas pelo servidor em runtime (`next start`), não embutidas no build: ver
      # "Variáveis de ambiente" em apps/web/README.md.
      APP_ENV: preview
      APP_URL: http://127.0.0.1:3000
      # Banco descartável para as telas de conta e salão (sem ele, /entrar e /cadastro
      # responderiam 500). O wrapper do E2E cria o banco, migra e sobe o app como
      # app_user/app_auth; o app não recebe a URL de superusuário.
      TEST_DATABASE_URL: postgresql://postgres:ci_only_not_a_secret@localhost:5432/app_test
    services:
      postgres:
        image: postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_only_not_a_secret
          POSTGRES_DB: app_test
          TZ: UTC
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Build de produção
        run: pnpm build
      - name: Subir o app (next start) em segundo plano
        run: |
          nohup node apps/web/scripts/with-e2e-database.mjs \
            pnpm --filter @salon/web run start --port 3000 --hostname 127.0.0.1 \
            >"${RUNNER_TEMP}/app.log" 2>&1 &
          for _ in $(seq 1 60); do
            if curl -fsS -o /dev/null http://127.0.0.1:3000/api/health; then
              exit 0
            fi
            sleep 2
          done
          echo "::error::O app não respondeu em /api/health em 120 s."
          cat "${RUNNER_TEMP}/app.log"
          exit 1
      - name: ZAP baseline
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: http://127.0.0.1:3000
          # Imagem oficial 2.17.0 (= :stable em 2026-10-16), pinada por digest.
          docker_name: ghcr.io/zaproxy/zaproxy:2.17.0@sha256:5ccfff9a411743ab2615136a2edd7416bec9ce41572fa94e935df38c14adb2b6
          rules_file_name: .zap/rules.tsv
          # -a regras alfa, -j spider AJAX além do tradicional, -I não falha por WARN (só pelas
          # regras FAIL do rules.tsv), -m minutos de spider, -T minutos máximos no total.
          cmd_options: -a -j -I -m 2 -T 10
          allow_issue_writing: false
          fail_action: true
          artifact_name: zap-baseline
      - name: Log do app (em falha)
        if: ${{ failure() }}
        run: cat "${RUNNER_TEMP}/app.log" || true
