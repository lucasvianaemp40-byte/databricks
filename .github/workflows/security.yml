# Segurança estática e de cadeia de suprimentos.
#
# Variável de repositório GHAS_ENABLED: code scanning (upload de SARIF) e dependency-review
# ficam LIGADOS por padrão, o que vale para repositório público e para privado com GitHub Code
# Security. Só um repositório privado SEM Code Security define GHAS_ENABLED = 'false'; aí cada
# ferramenta continua bloqueando pelo exit code e o SARIF/relatório fica como artefato do run.
# Ligado por padrão de propósito: num privado sem a variável o upload falha à vista, em vez de
# a revisão de licenças e o code scanning ficarem desligados em silêncio.
name: Security

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  schedule:
    - cron: "17 9 * * 1" # segunda 09:17 UTC (06:17 em São Paulo)
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  gitleaks:
    name: Segredos (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write # upload do SARIF (salvo com GHAS_ENABLED = 'false')
    env:
      # Imagem oficial (MIT), pinada por digest. A gitleaks-action exige licença para org.
      GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # histórico completo: push/cron varrem todos os commits
          persist-credentials: false
      # O binário é estático: roda direto no runner, sem problemas de dono de arquivo ou de
      # safe.directory dentro do contêiner.
      - name: Extrair o gitleaks da imagem pinada
        run: |
          docker pull --quiet "${GITLEAKS_IMAGE}"
          container_id="$(docker create "${GITLEAKS_IMAGE}")"
          docker cp "${container_id}:/usr/bin/gitleaks" "${RUNNER_TEMP}/gitleaks"
          docker rm "${container_id}" >/dev/null
          "${RUNNER_TEMP}/gitleaks" version
      - name: Autoteste das regras próprias (.gitleaks.toml)
        run: .github/scripts/gitleaks-selftest.sh "${RUNNER_TEMP}/gitleaks" .gitleaks.toml
      - name: Varredura do histórico
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          MQ_BASE: ${{ github.event.merge_group.base_sha }}
          MQ_HEAD: ${{ github.event.merge_group.head_sha }}
        run: |
          case "${EVENT_NAME}" in
            pull_request) log_opts="${PR_BASE}..${PR_HEAD}" ;;
            merge_group) log_opts="${MQ_BASE}..${MQ_HEAD}" ;;
            *) log_opts="--all" ;;
          esac
          "${RUNNER_TEMP}/gitleaks" git . \
            --config .gitleaks.toml \
            --log-opts="${log_opts}" \
            --redact --no-banner \
            --report-format sarif --report-path gitleaks.sarif
      - name: Upload do SARIF (code scanning)
        if: ${{ !cancelled() && vars.GHAS_ENABLED != 'false' && hashFiles('gitleaks.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks
      - name: Relatório como artefato (GHAS_ENABLED = 'false'; valores mascarados por --redact)
        if: ${{ failure() && vars.GHAS_ENABLED == 'false' && hashFiles('gitleaks.sarif') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gitleaks-sarif
          path: gitleaks.sarif
          retention-days: 7

  semgrep:
    name: SAST (Semgrep)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: semgrep/semgrep:1.180.0@sha256:529ee8a277ec8adc5b534d7c74eea0a47e9de21d62852b6ba7ac6ba9566845c3
    permissions:
      contents: read
      security-events: write # upload do SARIF (salvo com GHAS_ENABLED = 'false')
    env:
      SEMGREP_SEND_METRICS: "off"
      SEMGREP_ENABLE_VERSION_CHECK: "0"
      # PR e merge queue: só achados NOVOS em relação à base. Push/cron: varredura completa.
      BASELINE_COMMIT: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # --baseline-commit precisa do histórico
          persist-credentials: false
      # A imagem é Alpine: os passos usam sh POSIX.
      - name: Testes das regras próprias (.semgrep/rules)
        shell: sh
        run: semgrep --test --metrics=off .semgrep/rules
      # Bloqueia em severidade ERROR: todas as regras próprias e as regras de alta confiança
      # dos pacotes. WARNING/INFO vão para o relatório abaixo (code scanning ou artefato).
      - name: Varredura (bloqueante, severidade ERROR)
        shell: sh
        run: |
          set -eu
          if [ -n "${BASELINE_COMMIT}" ]; then set -- --baseline-commit "${BASELINE_COMMIT}"; else set --; fi
          semgrep scan \
            --config p/default \
            --config p/typescript \
            --config p/nextjs \
            --config p/react \
            --config p/nodejs \
            --config p/secrets \
            --config p/github-actions \
            --config .semgrep/rules \
            --severity ERROR \
            --metrics=off \
            --error \
            "$@"
      - name: Relatório completo (todas as severidades, SARIF)
        if: ${{ !cancelled() }}
        shell: sh
        run: |
          set -eu
          if [ -n "${BASELINE_COMMIT}" ]; then set -- --baseline-commit "${BASELINE_COMMIT}"; else set --; fi
          semgrep scan \
            --config p/default \
            --config p/typescript \
            --config p/nextjs \
            --config p/react \
            --config p/nodejs \
            --config p/secrets \
            --config p/github-actions \
            --config .semgrep/rules \
            --metrics=off \
            --sarif-output=semgrep.sarif \
            "$@"
      - name: Upload do SARIF (code scanning)
        if: ${{ !cancelled() && vars.GHAS_ENABLED != 'false' && hashFiles('semgrep.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: semgrep.sarif
          category: semgrep
      - name: Relatório como artefato (GHAS_ENABLED = 'false')
        if: ${{ !cancelled() && vars.GHAS_ENABLED == 'false' && hashFiles('semgrep.sarif') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: semgrep-sarif
          path: semgrep.sarif
          retention-days: 7

  # Job próprio em vez do workflow reutilizável google/osv-scanner-action: aquele decide pela
  # existência do arquivo de resultado (o osv-scanner grava JSON "limpo" mesmo saindo com erro,
  # ex.: osv.dev fora do ar) e puxa a imagem por tag. Aqui a imagem é pinada por digest e a
  # decisão é pelo exit code (.github/scripts/osv-gate.sh, com testes no passo anterior).
  # PR: só vulnerabilidade NOVA em relação à base bloqueia (a base sem lockfile ou sem a config
  # vira linha de base vazia). Push, merge queue e manual: qualquer vulnerabilidade bloqueia.
  # Cron: só avisa (o Renovate abre a correção a partir do alerta).
  osv:
    name: Vulnerabilidades (OSV-Scanner)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write # upload do SARIF (salvo com GHAS_ENABLED = 'false')
    env:
      # Imagem oficial (Apache-2.0), pinada por digest (índice multi-arquitetura da v2.6.0).
      OSV_IMAGE: ghcr.io/google/osv-scanner:v2.6.0@sha256:afd838850ac1a0fcc15ff4a041dc9ba11123c3f0d2666217a5f0fcf9222b55fa
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: head
          persist-credentials: false
      - name: Base do PR (para comparar)
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false
      # O binário é estático (CGO_ENABLED=0): roda direto no runner, como o gitleaks.
      - name: Extrair o osv-scanner da imagem pinada
        run: |
          docker pull --quiet "${OSV_IMAGE}"
          container_id="$(docker create "${OSV_IMAGE}")"
          docker cp "${container_id}:/osv-scanner" "${RUNNER_TEMP}/osv-scanner"
          docker rm "${container_id}" >/dev/null
          "${RUNNER_TEMP}/osv-scanner" --version
      - name: Testes da decisão (exit code, diff com a base)
        run: head/.github/scripts/osv-gate.test.sh
      - name: Varredura e decisão
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "${EVENT_NAME}" == "pull_request" ]]; then set -- base; else set --; fi
          head/.github/scripts/osv-gate.sh "${RUNNER_TEMP}/osv-scanner" head "$@"
      # Relatório para o code scanning. A decisão já foi tomada no passo anterior: uma falha
      # aqui (ex.: rede) não muda o resultado do job, só deixa de enviar o SARIF.
      - name: SARIF para o code scanning
        id: sarif
        if: ${{ !cancelled() && vars.GHAS_ENABLED != 'false' }}
        continue-on-error: true
        run: |
          rc=0
          "${RUNNER_TEMP}/osv-scanner" scan source --format=sarif --output-file=osv.sarif \
            --config=head/.github/osv-scanner.toml --recursive head || rc=$?
          if [[ "${rc}" -gt 1 ]]; then
            echo "::warning::osv-scanner (SARIF) saiu com ${rc}; relatório não enviado."
            exit 1
          fi
      - name: Upload do SARIF (code scanning)
        if: ${{ !cancelled() && steps.sarif.outcome == 'success' && hashFiles('osv.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: osv.sarif
          category: osv-scanner
          # O SARIF traz caminhos absolutos (file:///.../head/pnpm-lock.yaml).
          checkout_path: ${{ github.workspace }}/head

  trivy:
    name: Vulnerabilidades (Trivy fs)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write # upload do SARIF (salvo com GHAS_ENABLED = 'false')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          # O padrão desta versão da action (v0.70.0) não lê lockfile do pnpm com 2 documentos
          # (pnpm 12); a v0.75.0 lê os dois formatos. Conferido localmente: lê o pnpm-lock.yaml
          # deste repo (dependências de produção; as de dev ficam com OSV e pnpm audit).
          # Nunca usar a v0.69.4 (release maliciosa de mar/2026).
          # renovate: datasource=github-releases depName=aquasecurity/trivy
          version: v0.75.0
          scan-type: fs
          scan-ref: .
          # Só `vuln`: o repositório não tem Dockerfile nem IaC (o `misconfig` não achava alvo
          # nenhum, "Detected config files num=0") e o Trivy não analisa workflows do GitHub
          # Actions, que ficam com zizmor e actionlint. Volte a incluir `misconfig` quando
          # houver Dockerfile/IaC.
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: sarif
          output: trivy.sarif
          limit-severities-for-sarif: true
      - name: Upload do SARIF (code scanning)
        if: ${{ !cancelled() && vars.GHAS_ENABLED != 'false' && hashFiles('trivy.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: trivy.sarif
          category: trivy
      - name: Relatório como artefato (GHAS_ENABLED = 'false')
        if: ${{ failure() && vars.GHAS_ENABLED == 'false' && hashFiles('trivy.sarif') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivy-sarif
          path: trivy.sarif
          retention-days: 7

  dependency-review:
    name: Revisão de dependências (licenças e advisories)
    # Usa o dependency graph do GitHub: repo público ou privado com GHAS (ver o topo do arquivo).
    if: ${{ github.event_name == 'pull_request' && vars.GHAS_ENABLED != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          fail-on-scopes: runtime, development
          # Riscos aceitos: os mesmos de .github/osv-scanner.toml e do audit.ignore do
          # pnpm-workspace.yaml (justificativa e prazo de revisão estão lá).
          allow-ghsas: GHSA-vfj7-8cjw-p6xm, GHSA-67mh-4wv8-2f99
          # SaaS sem distribuição de binários. Lista conferida contra o SBOM atual (pnpm sbom):
          # LGPL-3.0-or-later vem do libvips do sharp (otimizador de imagem do Next).
          allow-licenses: >-
            MIT, Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC, 0BSD, BlueOak-1.0.0, CC0-1.0,
            CC-BY-4.0, Unlicense, MPL-2.0, Python-2.0, Zlib, LGPL-3.0-or-later
          show-openssf-scorecard: true
          warn-on-openssf-scorecard-level: 3
          comment-summary-in-pr: never

  zizmor:
    name: Auditoria dos workflows (zizmor)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read # auditorias online (impostor-commit, known-vulnerable-actions)
      security-events: write # upload do SARIF (salvo com GHAS_ENABLED = 'false')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A action roda a imagem ghcr.io/zizmorcore/zizmor:<versão> pinada por digest
      # (support/versions da própria action). Configuração: .github/zizmor.yml.
      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          # renovate: datasource=pypi depName=zizmor
          version: 1.30.1
          persona: regular
          min-severity: low
          advanced-security: ${{ vars.GHAS_ENABLED != 'false' }}
          annotations: ${{ vars.GHAS_ENABLED == 'false' }}

  actionlint:
    name: Lint dos workflows e scripts (actionlint, shellcheck)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      # Imagem oficial pinada por digest. Traz o shellcheck (0.11.0, em /usr/local/bin) e o
      # pyflakes, que o actionlint usa nos blocos run:; o passo seguinte reaproveita o mesmo
      # shellcheck para os scripts do repositório.
      ACTIONLINT_IMAGE: rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint (workflows e ação composta)
        run: |
          docker run --rm \
            --volume "${GITHUB_WORKSPACE}:/repo:ro" \
            --workdir /repo \
            "${ACTIONLINT_IMAGE}" \
            -color
      # Todo *.sh versionado, menos o material de terceiros vendorizado em .claude/skills/ (só
      # muda pelo scripts/vendor-claude-skills.sh). Script novo entra sozinho na lista.
      - name: shellcheck (scripts do repositório)
        if: ${{ !cancelled() }}
        run: |
          mapfile -d '' -t scripts < <(git ls-files -z -- '*.sh' \
            ':(exclude,glob).claude/skills/tob-*/**' \
            ':(exclude,glob).claude/skills/sentry-*/**' \
            ':(exclude,glob).claude/skills/anthropic-*/**' \
            ':(exclude,glob).claude/skills/superpowers-*/**' \
            ':(exclude,glob).claude/skills/ms-*/**')
          if [[ "${#scripts[@]}" -eq 0 ]]; then
            echo "::error::Nenhum script *.sh encontrado: o filtro do git ls-files quebrou?"
            exit 1
          fi
          printf '%s\n' "${scripts[@]}"
          docker run --rm \
            --volume "${GITHUB_WORKSPACE}:/repo:ro" \
            --workdir /repo \
            --entrypoint /usr/local/bin/shellcheck \
            "${ACTIONLINT_IMAGE}" \
            --color=always -- "${scripts[@]}"

  pnpm-supply-chain:
    name: Supply chain do pnpm (assinaturas, audit, SBOM)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Sem cache e sem scripts: este job só inspeciona o grafo resolvido. O próprio install já
      # reaplica minimumReleaseAge e trustPolicy a cada pacote do lockfile.
      - uses: ./.github/actions/setup
        with:
          cache: "false"
          install-args: --ignore-scripts
      - name: Assinaturas do registry (ECDSA) de todos os pacotes do lockfile
        run: pnpm audit signatures
      - name: Advisories (>= high, inclui devDependencies)
        if: ${{ !cancelled() }}
        run: pnpm audit --audit-level high
      - name: SBOM CycloneDX
        if: ${{ !cancelled() }}
        run: pnpm sbom --sbom-format cyclonedx --sbom-type application --out sbom.cdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() && hashFiles('sbom.cdx.json') != '' }}
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json
          if-no-files-found: error
          retention-days: 30

  # Check obrigatório do ruleset (junto com ci-ok e pr-title). Todos os jobs precisam terminar
  # "success". Única exceção: dependency-review pode terminar "skipped" fora de pull_request ou
  # quando o repositório desligou o GHAS de propósito (GHAS_ENABLED = 'false'); num PR com
  # GHAS, pulado é falha.
  security-ok:
    name: security-ok
    if: ${{ always() }}
    needs:
      - gitleaks
      - semgrep
      - osv
      - trivy
      - dependency-review
      - zizmor
      - actionlint
      - pnpm-supply-chain
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Conferir o resultado dos jobs
        env:
          NEEDS: ${{ toJSON(needs) }}
          EVENT_NAME: ${{ github.event_name }}
          GHAS_ENABLED: ${{ vars.GHAS_ENABLED }}
        run: |
          if [[ "${EVENT_NAME}" != "pull_request" || "${GHAS_ENABLED}" == "false" ]]; then
            optional='["dependency-review"]'
          else
            optional='[]'
          fi
          echo "${NEEDS}" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          failed="$(echo "${NEEDS}" | jq -r --argjson optional "${optional}" '
            to_entries[]
            | select(.value.result != "success")
            | select((.value.result == "skipped" and (.key as $k | $optional | index($k))) | not)
            | .key')"
          if [[ -n "${failed}" ]]; then
            echo "::error::Jobs de segurança sem sucesso: $(echo "${failed}" | tr '\n' ' ')"
            exit 1
          fi
