# Claude interativo: responde a "@claude" em issues, PRs e revisões (opcional).
#
# Pré-requisitos: GitHub App "Claude" instalado no repositório (`/install-github-app` no
# Claude Code) e o segredo ANTHROPIC_API_KEY ou CLAUDE_CODE_OAUTH_TOKEN. Sem segredo, o job
# fica pulado.
#
# Quem pode acionar: só OWNER, MEMBER ou COLLABORATOR (filtro abaixo) E com permissão de
# escrita (a própria action confere e recusa os demais). Comentário de terceiros em PR de fork
# nunca dispara o agente com segredos.
# Commits saem assinados pela API do GitHub (use_commit_signing), exigência do ruleset.
name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

permissions: {}

# Sem `concurrency` no nível do workflow: todo comentário (de qualquer conta, o repositório é
# público) cria um run, e um run novo no mesmo grupo cancelaria o pedido @claude que estivesse
# na fila. A concorrência fica no job `claude`, que só existe quando o gate passa.

jobs:
  gate:
    name: Verificar acionamento
    if: >-
      ${{ (github.event_name == 'issue_comment'
            && contains(github.event.comment.body, '@claude')
            && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
          || (github.event_name == 'pull_request_review_comment'
            && contains(github.event.comment.body, '@claude')
            && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
          || (github.event_name == 'pull_request_review'
            && contains(github.event.review.body, '@claude')
            && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association))
          || (github.event_name == 'issues'
            && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude'))
            && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - id: check
        name: Algum segredo de autenticação configurado?
        env:
          HAS_API_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
          HAS_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
        run: |
          if [[ "${HAS_API_KEY}" == "true" || "${HAS_OAUTH_TOKEN}" == "true" ]]; then
            echo "enabled=true" >> "${GITHUB_OUTPUT}"
          else
            echo "enabled=false" >> "${GITHUB_OUTPUT}"
            echo "::notice::Claude desligado: configure ANTHROPIC_API_KEY ou CLAUDE_CODE_OAUTH_TOKEN."
          fi

  claude:
    name: Claude
    needs: gate
    if: ${{ needs.gate.outputs.enabled == 'true' }}
    # Um @claude por issue/PR de cada vez, em fila. `queue: max` (até 100 pendentes): com o
    # padrão `single`, um pedido novo cancelaria o que já estava esperando.
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    cache-mode: none
    permissions:
      contents: write # branches e commits do Claude (assinados via API)
      pull-requests: write # abrir PR e comentar
      issues: write # responder na issue
      id-token: write # troca OIDC pelo token do GitHub App do Claude
      actions: read # ler resultado do CI para corrigir falhas
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: anthropics/claude-code-action@1d6de8cb0c237e7c15e9e1bdf973826ebae490cc # v1.0.248
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          use_commit_signing: true
          claude_args: |
            --model ${{ vars.CLAUDE_MODEL || 'claude-opus-5-5' }}
            --max-turns 40
